name: vitto_app
description: "Vitto marketplace – responsive Flutter Web MVP (Nigeria / Benin)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  supabase_flutter: ^2.18.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Onest (SIL Open Font License, see assets/fonts/OFL.txt). Variable font;
    # weights are applied through the wght axis in AppTheme.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
